   #include<stdio.h>
   int largearr(int arr[],int n)
   {
       int i,largest;
       largest=arr[0];
  
       for(i=1;i<=n;i++)
       {
           if(arr[i]>largest)
          {
              largest=arr[i];
          }
      }
  return largest;
  }
  int main()
  {
      int arr[100],n,i;
      printf("Enter no.of array: ");
      scanf("%d",&n);
      printf("Enter array elements: ");
      for(i=0;i<n;i++)
      {
          scanf("%d",&arr[i]);
      }
      printf("Largest element in array:%d",largearr(arr,n));
      return 0;
  }
